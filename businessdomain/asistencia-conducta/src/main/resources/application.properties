server.port=8083
spring.application.name=BUSINESSDOMAIN-ASISTENCIA-CONDUCTA


springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.healthcheck.enabled=true
eureka.client.fetch-registry=true
spring.cloud.config.override-none=false

spring.datasource.url=jdbc:mysql://localhost:3306/colegiodb?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

spring.jpa.hibernate.ddl-auto=update

spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=false

management.endpoints.web.exposure.include=*
management.endpoint.info.enabled=true
management.endpoint.health.enabled=true

spring.jpa.show-sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.springframework.jdbc.datasource.init=DEBUG

resilience4j.circuitbreaker.instances.academicaCB.sliding-window-type=COUNT_BASED

resilience4j.circuitbreaker.instances.academicaCB.sliding-window-size=5

resilience4j.circuitbreaker.instances.academicaCB.failure-rate-threshold=50

resilience4j.circuitbreaker.instances.academicaCB.wait-duration-in-open-state=10s

resilience4j.circuitbreaker.instances.academicaCB.permitted-number-of-calls-in-half-open-state=2