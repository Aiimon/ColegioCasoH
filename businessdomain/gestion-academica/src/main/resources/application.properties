# ===================================================================
# 1. IDENTIFICACIÓN Y PUERTO
# ===================================================================
server.port=8081
spring.application.name=BUSINESSDOMAIN-GESTION-ACADEMICA
# ===================================================================
# 2. CONEXIÓN AL SERVIDOR EUREKA 
# ===================================================================
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.healthcheck.enabled=true
eureka.client.fetch-registry=true
spring.cloud.config.override-none=false

# ===================================================================
# 3. BASE DE DATOS H2 EN MEMORIA Y SCRIPTS AUTOMÁTICOS
# ===================================================================
spring.datasource.url=jdbc:h2:mem:colegiodb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true

# Estrategia de creación: Crea las tablas al iniciar y las destruye al apagar el servidor
spring.jpa.hibernate.ddl-auto=create-drop

# Inicialización de datos: Fuerza la lectura de tu archivo 'import.sql'
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# ===================================================================
# 4. MONITOREO ACTUATOR
# ===================================================================
management.endpoints.web.exposure.include=*
management.endpoint.info.enabled=true
management.endpoint.health.enabled=true