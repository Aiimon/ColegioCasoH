server:
  port: 8080

spring:
  main:
    web-application-type: reactive
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "http://localhost:5173"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
            allowedHeaders: "*"
      routes:
        - id: gestion_academica_route
          uri: lb://BUSINESSDOMAIN-GESTION-ACADEMICA
          predicates:
            - Path=/api/v1/academica/**
          filters:
            - AuthenticationFilterinig
            
        - id: asistencia_conducta_route
          uri: lb://BUSINESSDOMAIN-ASISTENCIA-CONDUCTA 
          predicates:
            - Path=/api/v1/conducta/**
          filters:
            - AuthenticationFilterinig

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka